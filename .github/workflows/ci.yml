name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    # windows-latest is required, not a preference: the test project targets net10.0-windows
    # because it references the WPF app.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - run: dotnet build --configuration Release

      - run: dotnet test --configuration Release --no-build
